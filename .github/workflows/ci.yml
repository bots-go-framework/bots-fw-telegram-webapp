name: Go CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v[0-9]+\.[0-9]+\.[0-9]+' # Push events to matching v*, i.e. v20.15.10
    paths:
      - '.github/workflows/**.yml'
      - 'go.*'
      - '**/*.go'
  pull_request:
    branches:
      - '**'
    paths:
      - '.github/workflows/**.yml'
      - 'src/**'
      - 'go.*'
      # '**/*.go', not '*.go': GitHub's '*' never crosses '/', so '*.go' matched
      # only root-level files and a PR touching just a package (tgoidc/,
      # tgloginwidget/, twainitdata/) ran no checks at all.
      - '**/*.go'

jobs:

  strongo_workflow:
    permissions:
      contents: write
    uses: strongo/cicd/.github/workflows/workflow.yml@main

    secrets:
      # This token is used to retrieve private repositories & bump version ${{ secrets.GH_ACCESS_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    with:
      disable-version-bumping: false
